<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Black Crest Soft</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
    body { background: #0b0c10; color: #fff; overflow-x: hidden; }
    #canvas { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -1; }
    header { padding: 20px 50px; display: flex; justify-content: space-between; align-items: center; background: rgba(11,12,16,0.8); backdrop-filter: blur(10px); position: fixed; width: 100%; z-index: 10; }
    .logo { font-size: 24px; font-weight: bold; color: #66fcf1; text-transform: uppercase; letter-spacing: 2px; }
    nav a { color: #c5c6c7; text-decoration: none; margin-left: 30px; transition: 0.3s; }
    nav a:hover { color: #66fcf1; }
    .hero { height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 0 20px; }
    .hero h1 { font-size: 50px; margin-bottom: 20px; color: #66fcf1; text-shadow: 0 0 10px rgba(102,252,241,0.5); }
    .hero p { font-size: 20px; color: #c5c6c7; max-width: 600px; margin-bottom: 30px; }
    .btn { padding: 12px 30px; border: 2px solid #66fcf1; color: #66fcf1; text-decoration: none; border-radius: 25px; transition: 0.3s; font-weight: bold; }
    .btn:hover { background: #66fcf1; color: #0b0c10; box-shadow: 0 0 20px #66fcf1; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
  <div id="canvas"></div>
  <header>
    <div class="logo">Black Crest Soft</div>
    <nav>
      <a href="#about">About</a>
      <a href="#services">Services</a>
      <a href="#contact">Contact</a>
    </nav>
  </header>
  <section class="hero">
    <h1>Black Crest Soft</h1>
    <p>Next-Generation 3D Software Engineering & Interactive Digital Experiences.</p>
    <a href="#services" class="btn">Explore Work</a>
  </section>
  <script>
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.getElementById('canvas').appendChild(renderer.domElement);
    const geometry = new THREE.TorusKnotGeometry(1.5, 0.4, 100, 16);
    const material = new THREE.MeshBasicMaterial({ color: 0x66fcf1, wireframe: true });
    const torusKnot = new THREE.Mesh(geometry, material);
    scene.add(torusKnot);
    camera.position.z = 5;
    function animate() {
      requestAnimationFrame(animate);
      torusKnot.rotation.x += 0.01;
      torusKnot.rotation.y += 0.01;
      renderer.render(scene, camera);
    }
    animate();
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
